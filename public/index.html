<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">

<!-- ────────────────────────────────────────────────────────────
     카카오톡 / 페이스북 미리보기(OG 태그)
     ▸ 아래 5줄만 우리 동창회 내용으로 고쳐주세요.
     ▸ og:image 는 반드시 https:// 로 시작하는 전체 주소여야 합니다.
       지금은 히어로 이미지(assets/img/hero.jpg)를 쓰도록 해두었습니다.
       카톡용으로 따로 만들려면 1200x630 이미지를 assets/img/og.png 로 올리고
       아래 og:image 주소만 og.png 로 바꾸세요.
──────────────────────────────────────────────────────────── -->
<title>대건고 65기 1회 총동창회 초대장</title>
<meta name="description" content="2026년 9월 12일 토요일 오후 2시, 대전 사정공원. 참석 여부를 알려주세요!">
<meta property="og:type" content="website">
<meta property="og:title" content="대건고 65기 1회 총동창회에 초대합니다">
<meta property="og:description" content="2026년 9월 12일 (토) 오후 2시 · 대전 사정공원 — 참석 여부를 알려주세요!">
<meta property="og:image" content="https://reunion-invitation.sharpaero11.workers.dev/assets/img/hero.jpg">
<meta property="og:url" content="https://reunion-invitation.sharpaero11.workers.dev">
<meta property="og:site_name" content="대건고 65기 총동창회">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<!-- ══ 히어로 ══════════════════════════════════════════════ -->
<header class="hero">
  <div class="hero__wash" aria-hidden="true"></div>
  <div class="hero__inner">
    <p class="hero__host" data-cfg="hostLine"></p>
    <figure class="hero__plate" id="heroPlate" hidden>
      <img src="" alt="" id="heroImg">
    </figure>
    <h1 class="hero__title" data-cfg="title"></h1>
    <p class="hero__subtitle" data-cfg="subtitle"></p>

    <div class="dday" id="dday">
      <p class="dday__label" data-ui="ddayLabel">동창회까지</p>
      <p class="dday__big" id="ddayBig" aria-live="polite">D-<span id="ddayNum">–</span></p>
      <ul class="dday__clock" id="ddayClock">
        <li><strong id="cDays">–</strong><span>일</span></li>
        <li><strong id="cHours">–</strong><span>시간</span></li>
        <li><strong id="cMins">–</strong><span>분</span></li>
        <li><strong id="cSecs">–</strong><span>초</span></li>
      </ul>
    </div>

    <a class="hero__cta" href="#rsvp" data-ui="heroCta">참석 여부 알려주기 ↓</a>
  </div>
</header>

<main>
  <!-- ══ 인사말 ═════════════════════════════════════════════ -->
  <section class="section greeting">
    <p class="greeting__text" id="greeting"></p>
  </section>

  <!-- ══ 일시 / 장소 / 회비 ═════════════════════════════════ -->
  <section class="section" id="info">
    <h2 class="section__title" data-ui="infoTitle">모임 안내</h2>

    <ul class="info">
      <li class="info__row">
        <span class="info__icon" aria-hidden="true">🗓️</span>
        <div>
          <p class="info__label" data-ui="labelDate">일시</p>
          <p class="info__value" data-cfg="dateText"></p>
        </div>
      </li>
      <li class="info__row">
        <span class="info__icon" aria-hidden="true">📍</span>
        <div>
          <p class="info__label" data-ui="labelPlace">장소</p>
          <p class="info__value" data-cfg="placeName"></p>
          <p class="info__sub" data-cfg="placeAddress"></p>
          <p class="info__sub" data-cfg="placeDetail"></p>
        </div>
      </li>
      <li class="info__row">
        <span class="info__icon" aria-hidden="true">💰</span>
        <div>
          <p class="info__label" data-ui="labelFee">회비</p>
          <p class="info__value" data-cfg="fee"></p>
          <p class="info__sub" data-cfg="feeDetail"></p>
        </div>
      </li>
    </ul>

    <!-- 지도 링크 -->
    <div class="maps" id="maps">
      <a class="btn btn--map btn--kakao" id="kakaoMap" href="#" target="_blank" rel="noopener">
        <span aria-hidden="true">🗺️</span> <span data-ui="kakaoBtn">카카오맵에서 보기</span>
      </a>
      <a class="btn btn--map btn--naver" id="naverMap" href="#" target="_blank" rel="noopener">
        <span aria-hidden="true">🧭</span> <span data-ui="naverBtn">네이버지도에서 보기</span>
      </a>
      <a class="btn btn--map btn--call" id="contactCall" href="#">
        <span aria-hidden="true">📞</span> <span id="contactLabel">문의하기</span>
      </a>
    </div>
  </section>

  <!-- ══ 참석 투표 ══════════════════════════════════════════ -->
  <section class="section" id="rsvp">
    <h2 class="section__title" data-ui="rsvpTitle">참석 투표</h2>
    <p class="section__desc" data-ui="rsvpDesc">로그인 없이 이름만 적으면 됩니다. 같은 이름으로 다시 보내면 답변이 수정돼요.</p>

    <form class="form" id="rsvpForm" novalidate>
      <label class="field">
        <span class="field__label" data-ui="nameLabel">이름</span>
        <input class="field__input" type="text" id="name" name="name"
               data-ui-ph="namePlaceholder" placeholder="예) 김한빛 (3반)"
               maxlength="30" autocomplete="name" required>
      </label>

      <fieldset class="choices">
        <legend class="field__label" data-ui="statusLabel">참석 여부</legend>
        <div class="choices__row" id="statusRow">
          <label class="choice choice--yes">
            <input type="radio" name="status" value="참석" required>
            <span class="choice__box"><span class="choice__emoji" aria-hidden="true">🙋</span>참석</span>
          </label>
          <label class="choice choice--no">
            <input type="radio" name="status" value="불참">
            <span class="choice__box"><span class="choice__emoji" aria-hidden="true">🙇</span>불참</span>
          </label>
          <label class="choice choice--maybe">
            <input type="radio" name="status" value="미정">
            <span class="choice__box"><span class="choice__emoji" aria-hidden="true">🤔</span>미정</span>
          </label>
        </div>
      </fieldset>

      <label class="field">
        <span class="field__label"><span data-ui="messageLabel">한마디</span>
          <em data-ui="messageOptional">(선택)</em></span>
        <textarea class="field__input field__input--area" id="message" name="message"
                  rows="3" maxlength="200"
                  data-ui-ph="messagePlaceholder" placeholder="다들 보고싶다! 늦게라도 갈게~"></textarea>
        <span class="field__count"><span id="msgCount">0</span>/200</span>
      </label>

      <button class="btn btn--primary" type="submit" id="submitBtn" data-ui="submit">보내기</button>
      <p class="form__msg" id="formMsg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- ══ 참석자 명단 ════════════════════════════════════════ -->
  <section class="section" id="list">
    <h2 class="section__title" data-ui="listTitle">참석자 명단</h2>

    <ul class="counts" id="counts">
      <li class="count count--yes"><strong id="cntYes">–</strong><span>참석</span></li>
      <li class="count count--no"><strong id="cntNo">–</strong><span>불참</span></li>
      <li class="count count--maybe"><strong id="cntMaybe">–</strong><span>미정</span></li>
    </ul>

    <div class="list__bar">
      <div class="filters" role="group" aria-label="명단 필터">
        <button class="chip is-on" data-filter="전체" type="button" data-ui="filterAll">전체</button>
        <button class="chip" data-filter="참석" type="button">참석</button>
        <button class="chip" data-filter="불참" type="button">불참</button>
        <button class="chip" data-filter="미정" type="button">미정</button>
      </div>
      <button class="refresh" id="refreshBtn" type="button" aria-label="명단 새로고침" data-ui="refresh">↻ 새로고침</button>
    </div>

    <ul class="people" id="people" aria-live="polite"></ul>
    <p class="list__empty" id="listEmpty" hidden></p>
    <p class="list__updated" id="listUpdated"></p>
  </section>
</main>

<footer class="footer">
  <p data-cfg="hostLine"></p>
  <p class="footer__small" data-ui="footerNote">이 초대장은 참석 집계 용도로만 사용되며, 남기신 이름과 한마디는 명단에 공개됩니다.</p>
</footer>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
